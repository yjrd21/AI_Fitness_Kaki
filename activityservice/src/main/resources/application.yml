spring:
  application:
    name: activity-service

  config:
    import: optional:file:./atlas-credentials.env[.properties]

  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:fitnessactivity}
    
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
server:
  port: 8082
